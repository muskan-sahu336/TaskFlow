<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>TaskFlow</h1>
    <p class="subtitle" id="subtitle">Log in to manage your tasks</p>

    <div class="tabs">
      <button type="button" class="tab active" id="tab-login">Login</button>
      <button type="button" class="tab" id="tab-register">Register</button>
    </div>

    <form id="auth-form">
      <input type="text" id="username" placeholder="Username" class="hidden">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password (min 6 characters)" required>
      <p class="error" id="error"></p>
      <button type="submit" class="btn-primary" id="submit-btn">Login</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
